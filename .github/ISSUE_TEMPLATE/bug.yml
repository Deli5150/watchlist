name: Bug
description: Something in WatchLine isn't working right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where
      multiple: true
      options: [Mac, Windows, Linux, iPhone, Android]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WatchLine version
      placeholder: 1.0.0
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or details
      description: Drag screenshots in here. Leave out anything private .
